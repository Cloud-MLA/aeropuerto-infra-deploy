# BE-TX-06 — Variante de nginx.conf con swagger-aggregator activo.
# Usar SOLO cuando la imagen btoroled/aeropuerto-frontend:swagger-<tag> ya exista en Docker Hub
# (var.enable_swagger_aggregator = true en terraform) — si no, nginx no arranca para ningún
# microservicio ("host not found in upstream swagger-aggregator:8080"). Ver nginx/nginx.conf
# para la variante sin swagger (la que usa Terraform por defecto).

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # Puertos internos (ver plantilla/README.md y docs/arquitectura.md §2)
    upstream ms1 { server ms1:8001; }
    upstream ms2 { server ms2:8002; }
    upstream ms3 { server ms3:8003; }
    upstream ms4 { server ms4:8004; }
    upstream ms5 { server ms5:8005; }
    upstream swagger { server swagger-aggregator:8080; }

    server {
        listen 80 default_server;

        # Cabeceras comunes hacia el upstream (heredadas por cada location)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout    30s;

        # Health del gateway — lo usa el target group del ALB
        location = /healthz {
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # MS1 (FastAPI) mapea sus rutas SIN el prefijo publico (/tickets,
        # /pasajeros, /health) — el slash final en proxy_pass hace que nginx
        # recorte el prefijo antes de reenviar:
        #   /api/pasajeros/tickets  ->  ms1:/tickets
        location /api/pasajeros/  { proxy_pass http://ms1/; }

        # MS2/MS3/MS4/MS5 ya traen el prefijo horneado en su propio codigo
        # (@RequestMapping("/api/vuelos"), API_PREFIX='/api/infra',
        # prefix="/api/manifiesto", prefix="/api/analitica") — por eso
        # proxy_pass NO lleva URI propia: nginx reenvia la URI original tal
        # cual la mando el cliente, sin recortar el prefijo. Recortarlo (como
        # se hacia antes) rompia TODOS los endpoints reales de estos 4
        # servicios (solo /health sobrevivia por un mount redundante en la
        # raiz de cada app).
        # springdoc sirve su UI/spec en rutas propias sin el prefijo de
        # negocio (/docs, /swagger-ui/**, /v3/api-docs) — estas 3 locations,
        # al ser mas especificas que /api/vuelos/, ganan la coincidencia y
        # SI recortan el prefijo para esas rutas puntuales.
        location /api/vuelos/docs {
            proxy_set_header X-Forwarded-Prefix /api/vuelos;
            proxy_pass http://ms2/docs;
        }
        location /api/vuelos/swagger-ui/ { proxy_pass http://ms2/swagger-ui/; }
        location /api/vuelos/v3/api-docs { proxy_pass http://ms2/v3/api-docs; }

        location /api/vuelos/     {
            proxy_set_header X-Forwarded-Prefix /api/vuelos;
            proxy_pass http://ms2;
        }
        location /api/infra/      { proxy_pass http://ms3; }
        location /api/manifiesto/ { proxy_pass http://ms4; }
        location /api/analitica/  { proxy_pass http://ms5; }
        location /docs/           { proxy_pass http://swagger/; }
        location = /docs          { return 301 /docs/; }

        location / {
            add_header Content-Type application/json;
            return 404 '{"error":{"code":"NO_ENCONTRADO","message":"ruta no existe","status":404,"service":"nginx-gateway"}}';
        }
    }
}
