# BE-TX-06 — Reverse proxy por path en cada VM-PROD.
# El ALB tiene un único target (:80) por VM; este nginx reparte a los 5 microservicios
# y a la página Swagger agregada. Nombres de host = nombres de servicio del docker compose.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # Puertos internos (ver plantilla/README.md y docs/arquitectura.md §2)
    upstream ms1 { server ms1:8001; }
    upstream ms2 { server ms2:8002; }
    upstream ms3 { server ms3:8003; }
    upstream ms4 { server ms4:8004; }
    upstream ms5 { server ms5:8005; }
    upstream swagger { server swagger-aggregator:8080; }

    server {
        listen 80 default_server;

        # Cabeceras comunes hacia el upstream (heredadas por cada location)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout    30s;

        # Health del gateway — lo usa el target group del ALB
        location = /healthz {
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # El slash final en proxy_pass hace que se recorte el prefijo:
        #   /api/pasajeros/tickets  ->  ms1:/tickets
        location /api/pasajeros/  { proxy_pass http://ms1/; }
        location /api/vuelos/     { proxy_pass http://ms2/; }
        location /api/infra/      { proxy_pass http://ms3/; }
        location /api/manifiesto/ { proxy_pass http://ms4/; }
        location /api/analitica/  { proxy_pass http://ms5/; }
        location /docs/           { proxy_pass http://swagger/; }
        location = /docs          { return 301 /docs/; }

        location / {
            add_header Content-Type application/json;
            return 404 '{"error":{"code":"NO_ENCONTRADO","message":"ruta no existe","status":404,"service":"nginx-gateway"}}';
        }
    }
}
